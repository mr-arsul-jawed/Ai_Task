name: CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      # 🔹 Backend Install
      - name: Install Backend Dependencies
        run: |
          cd backend
          npm install

      # 🔹 Backend Run Check
      - name: Test Backend Server
        run: |
          cd backend
          node server.js &
          SERVER_PID=$!
          sleep 5
          curl http://localhost:3000 || exit 1
          kill $SERVER_PID

      # 🔹 Frontend Install
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      # 🔹 Frontend Build Test
      - name: Build Frontend
        run: |
          cd frontend
          npm run build