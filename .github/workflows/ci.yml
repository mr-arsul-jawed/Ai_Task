name: CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # Updated to v4 for better performance

      - name: Setup Node.js
        uses: actions/setup-node@v4 # Updated to v4
        with:
          node-version: 22
          # Optional: cache: 'npm' - this speeds up future runs
          # cache-dependency-path: './Ai_Task/backend/package-lock.json'

      # --- BACKEND ---
      - name: Install Backend Dependencies
        working-directory: ./Ai_Task/backend
        run: npm install

      - name: Test Backend Server
        working-directory: ./Ai_Task/backend
        run: |
          node server.js &
          SERVER_PID=$!
          # Give the server a moment to start
          sleep 5
          # Simple health check
          curl --retry 3 --retry-connrefused http://localhost:3000 || exit 1
          kill $SERVER_PID

      # --- FRONTEND ---
      - name: Install Frontend Dependencies
        working-directory: ./Ai_Task/frontend
        run: npm install

      - name: Build Frontend
        working-directory: ./Ai_Task/frontend
        run: npm run build