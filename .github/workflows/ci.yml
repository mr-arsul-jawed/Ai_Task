name: CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 🔹 Backend - Using ALL CAPS to match your folder
      - name: Install Backend Dependencies
        working-directory: ./Ai_Task/BACKEND
        run: npm install

      - name: Test Backend Server
        working-directory: ./Ai_Task/BACKEND
        run: |
          node server.js &
          SERVER_PID=$!
          sleep 5
          curl --retry 3 --retry-connrefused http://localhost:3000 || exit 1
          kill $SERVER_PID

      # 🔹 Frontend - Using ALL CAPS to match your folder
      - name: Install Frontend Dependencies
        working-directory: ./Ai_Task/FRONTEND
        run: npm install

      - name: Build Frontend
        working-directory: ./Ai_Task/FRONTEND
        run: npm run build